<!doctype html>
<!--
  Standalone preview of the ROBOTDOG2D widget with simulated telemetry.
  No COSMOS required:

    pnpm run build:2d
    python3 -m http.server 8000
    open http://localhost:8000/dev/preview_2d.html

  The gait math mirrors targets/ROVER/procedures/inject_robotdog_tlm.py.
-->
<html>
  <head>
    <meta charset="utf-8" />
    <title>ROBOTDOG2D widget preview</title>
    <style>
      body {
        margin: 0;
        background: #1e1e1e;
        color: #eceff1;
        font-family: monospace;
      }
      #app {
        width: 100vw;
        height: 92vh;
      }
      .bar {
        display: flex;
        gap: 12px;
        align-items: center;
        padding: 6px 10px;
      }
    </style>
  </head>
  <body>
    <div class="bar">
      <label>rate <input id="rate" type="range" min="0" max="3" step="0.05" value="1" /></label>
      <label><input id="run" type="checkbox" checked /> animate</label>
      <label>t0 <input id="t0" type="number" value="0" step="0.5" style="width: 60px" /></label>
      <span id="clock"></span>
    </div>
    <div id="app"></div>

    <script src="../node_modules/vue/dist/vue.global.js"></script>
    <!-- The UMD bundle externalizes vue under the lowercase global name -->
    <script>
      window.vue = window.Vue
    </script>
    <script src="../tools/widgets/Robotdog2dWidget/Robotdog2dWidget.umd.min.js"></script>
    <script>
      const TARGET = 'ROVER'
      const PACKET = 'GET_PROTOCOL_EXCHANGE_RESPONSE'
      const HIP_BIAS = 0.45
      const KNEE_BIAS = -1.34
      const ABD_FRONT = 0.4
      const ABD_REAR = 0.68
      const SWING = 0.35
      const WHEEL_RATE = 3.0
      // name, gait phase, side (-1 port / +1 starboard), end (+1 front / -1 rear)
      const LEGS = [
        ['LEFT_FRONT', 0, -1, 1],
        ['RIGHT_FRONT', Math.PI, 1, 1],
        ['LEFT_REAR', Math.PI, -1, -1],
        ['RIGHT_REAR', 0, 1, -1],
      ]

      const legAngles = (phase, side, end, t) => {
        const theta = 2 * Math.PI * 0.5 * t + phase
        const hip = HIP_BIAS + SWING * Math.sin(theta)
        const knee = KNEE_BIAS + 0.5 * SWING * Math.sin(theta + Math.PI / 3)
        const abd = (end > 0 ? ABD_FRONT : ABD_REAR) + 0.1 * Math.sin(theta / 2)
        const wheel = (WHEEL_RATE * t) % (4 * Math.PI)
        // port legs report positive abduction, starboard legs negative
        return [-side * abd, end * hip, end * knee, end * wheel]
      }

      const app = Vue.createApp({
        components: {
          widget: window.Robotdog2dWidget.default || window.Robotdog2dWidget,
        },
        data() {
          return { screenValues: {}, t: Number(new URL(location.href).searchParams.get('t') || 0) }
        },
        computed: {
          settings() {
            return [
              ['HEIGHT', '100%'],
              ['TEMP_WARN', '60'],
              ['TEMP_ALARM', '75'],
              ['GRID', 'true'],
            ]
          },
        },
        mounted() {
          const rate = document.getElementById('rate')
          const run = document.getElementById('run')
          this.simulate(this.t)
          let last = performance.now()
          const tick = (now) => {
            const dt = (now - last) / 1000
            last = now
            if (run.checked) {
              this.t += dt * Number(rate.value)
            }
            this.simulate(this.t)
            document.getElementById('clock').textContent =
              `t = ${this.t.toFixed(1)} s`
            requestAnimationFrame(tick)
          }
          requestAnimationFrame(tick)
        },
        methods: {
          set(item, value, type = 'CONVERTED') {
            this.screenValues[`${TARGET}__${PACKET}__${item}__${type}`] = [
              value,
              null,
              Math.round(this.t * 10),
            ]
          },
          simulate(t) {
            for (const [index, leg] of LEGS.entries()) {
              const [name, phase, side, end] = leg
              this.set(`${name}_Q`, legAngles(phase, side, end, t))
              const base = 23 + index * 2
              this.set(`${name}_MOTOR_TEMP`, [
                Math.round(base + 25 * Math.max(0, Math.sin(t / 7 + index))),
                Math.round(base + 3 * Math.sin(t / 5 + index)),
                base + 2,
                base,
              ])
              this.set(`${name}_MOS_TEMP`, [base + 8, base + 6, base + 5, base])
              this.set(`${name}_MCU_TEMP`, [base + 4, base + 3, base + 2, base])
              this.set(`${name}_BUS_V`, [56, 56, 55, 55])
              this.set(`${name}_ERROR_CODE`, [0, 0, 0, 0])
            }
            const roll = ((12 * Math.PI) / 180) * Math.sin(2 * Math.PI * 0.15 * t)
            const pitch =
              ((8 * Math.PI) / 180) * Math.sin(2 * Math.PI * 0.11 * t + 1)
            const yaw = ((30 * Math.PI) / 180) * Math.sin(2 * Math.PI * 0.05 * t)
            this.set('RPY_0', roll)
            this.set('RPY_1', pitch)
            this.set('RPY_2', yaw)
            this.set('IMU_TEMP', 41.5 + Math.sin(t / 9))
            this.set('BATTERY_LEVEL', Math.max(0, Math.round(88 - t / 30)))
            this.set('PACKV', 56)
            this.set('VTOP', 57)
            this.set('CELLS_VOLTAGE', [3980, 3975, 3990, 3968, 3985, 0, 0, 0])
            this.set('EMERGENCY_STOP', false)
            this.set('SEARCH_LIGHT_STATE', true)
            this.set('CURRENT_STATE', 'WHEEL_READY', 'FORMATTED')
          },
        },
        template: `<widget :parameters="['${TARGET}','${PACKET}']"
          :settings="settings" :screen-values="screenValues" />`,
      })
      app.mount('#app')
    </script>
  </body>
</html>
