<!doctype html>
<!--
  Standalone preview of the ROBOTDOG widget with simulated telemetry.
  No COSMOS required:

    pnpm run build
    python3 -m http.server 8000
    open http://localhost:8000/dev/preview.html

  The gait math here mirrors targets/ROVER/procedures/inject_robotdog_tlm.py.
-->
<html>
  <head>
    <meta charset="utf-8" />
    <title>ROBOTDOG widget preview</title>
    <style>
      body {
        margin: 0;
        background: #1e1e1e;
        color: #eceff1;
        font-family: monospace;
      }
      #app {
        width: 100vw;
        height: 92vh;
      }
      .bar {
        display: flex;
        gap: 12px;
        align-items: center;
        padding: 6px 10px;
      }
    </style>
  </head>
  <body>
    <div class="bar">
      <label>rate <input id="rate" type="range" min="0" max="3" step="0.05" value="1" /></label>
      <label><input id="run" type="checkbox" checked /> animate</label>
      <label><input id="quat" type="checkbox" checked /> attitude from quaternion</label>
      <span id="clock"></span>
    </div>
    <div id="app"></div>

    <script src="../node_modules/vue/dist/vue.global.js"></script>
    <!-- The UMD bundle externalizes vue under the lowercase global name -->
    <script>
      window.vue = window.Vue
    </script>
    <script src="../tools/widgets/RobotdogWidget/RobotdogWidget.umd.min.js"></script>
    <script>
      const TARGET = 'ROVER'
      const PACKET = 'GET_PROTOCOL_EXCHANGE_RESPONSE'
      const HIP_BIAS = 0.45
      const KNEE_BIAS = -1.34
      const ABD_FRONT = 0.4
      const ABD_REAR = 0.68
      const SWING = 0.35
      const WHEEL_RATE = 3.0
      // name, gait phase, side (-1 port / +1 starboard), end (+1 front / -1 rear)
      const LEGS = [
        ['LEFT_FRONT', 0, -1, 1],
        ['RIGHT_FRONT', Math.PI, 1, 1],
        ['LEFT_REAR', Math.PI, -1, -1],
        ['RIGHT_REAR', 0, 1, -1],
      ]

      const legAngles = (phase, side, end, t) => {
        const theta = 2 * Math.PI * 0.5 * t + phase
        const hip = HIP_BIAS + SWING * Math.sin(theta)
        const knee = KNEE_BIAS + 0.5 * SWING * Math.sin(theta + Math.PI / 3)
        const abd = (end > 0 ? ABD_FRONT : ABD_REAR) + 0.1 * Math.sin(theta / 2)
        const wheel = (WHEEL_RATE * t) % (4 * Math.PI)
        // port legs report positive abduction, starboard legs negative
        return [-side * abd, end * hip, end * knee, end * wheel]
      }

      const app = Vue.createApp({
        components: {
          widget: window.RobotdogWidget.default || window.RobotdogWidget,
        },
        data() {
          return { screenValues: {}, t: 0, quat: true }
        },
        computed: {
          settings() {
            return [
              ['HEIGHT', '100%'],
              ['ATTITUDE', this.quat ? 'QUAT' : 'RPY'],
              ['WHEELS', 'true'],
            ]
          },
        },
        mounted() {
          const rate = document.getElementById('rate')
          const run = document.getElementById('run')
          const quat = document.getElementById('quat')
          quat.addEventListener('change', () => (this.quat = quat.checked))
          let last = performance.now()
          const tick = (now) => {
            const dt = (now - last) / 1000
            last = now
            if (run.checked) {
              this.t += dt * Number(rate.value)
            }
            this.simulate(this.t)
            document.getElementById('clock').textContent =
              `t = ${this.t.toFixed(1)} s`
            requestAnimationFrame(tick)
          }
          requestAnimationFrame(tick)
        },
        methods: {
          set(item, value, type = 'CONVERTED') {
            this.screenValues[`${TARGET}__${PACKET}__${item}__${type}`] = [
              value,
              null,
              Math.round(this.t * 10),
            ]
          },
          simulate(t) {
            for (const [index, leg] of LEGS.entries()) {
              const [name, phase, side, end] = leg
              this.set(`${name}_Q`, legAngles(phase, side, end, t))
              const base = 23 + index * 2
              this.set(`${name}_MOTOR_TEMP`, [
                Math.round(base + 25 * Math.max(0, Math.sin(t / 7 + index))),
                Math.round(base + 3 * Math.sin(t / 5 + index)),
                base + 2,
                base,
              ])
            }
            const roll = (12 * Math.PI / 180) * Math.sin(2 * Math.PI * 0.15 * t)
            const pitch =
              (8 * Math.PI / 180) * Math.sin(2 * Math.PI * 0.11 * t + 1)
            const yaw = (30 * Math.PI / 180) * Math.sin(2 * Math.PI * 0.05 * t)
            this.set('RPY_0', roll)
            this.set('RPY_1', pitch)
            this.set('RPY_2', yaw)
            const [cr, sr] = [Math.cos(roll / 2), Math.sin(roll / 2)]
            const [cp, sp] = [Math.cos(pitch / 2), Math.sin(pitch / 2)]
            const [cy, sy] = [Math.cos(yaw / 2), Math.sin(yaw / 2)]
            this.set('Q_0', cr * cp * cy + sr * sp * sy)
            this.set('Q_1', sr * cp * cy - cr * sp * sy)
            this.set('Q_2', cr * sp * cy + sr * cp * sy)
            this.set('Q_3', cr * cp * sy - sr * sp * cy)
            this.set('BATTERY_LEVEL', Math.max(0, Math.round(88 - t / 30)))
            this.set('PACKV', 56)
            this.set('EMERGENCY_STOP', false)
            this.set('RECEIVED_COUNT', Math.round(t * 10))
            this.set('CURRENT_STATE', 'WHEEL_READY', 'FORMATTED')
          },
        },
        template: `<widget :parameters="['${TARGET}','${PACKET}']"
          :settings="settings" :screen-values="screenValues" />`,
      })
      app.mount('#app')
    </script>
  </body>
</html>
